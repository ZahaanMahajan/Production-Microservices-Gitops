name: Microservices Trigger CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------
  # Detect which services changed
  # --------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changed
        run: |
          SERVICES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^src/' \
            | cut -d'/' -f2 \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "Detected services: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------
  # Build and push each changed service
  # --------------------------------------------------
  build-and-push:
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    # Reusable workflow must be called at the job level.
    uses: ./.github/workflows/microservice-ci.yaml

    with:
      service: ${{ matrix.service }}
