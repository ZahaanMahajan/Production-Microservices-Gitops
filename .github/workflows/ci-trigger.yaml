name: Microservices Trigger CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changed
        run: |
          SERVICES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^src/' \
            | cut -d'/' -f2 \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "Detected services: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes

    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    uses: ./.github/workflows/microservice-ci.yaml

    with:
      service: ${{ matrix.service }}

  update-gitops:
    needs:
      - detect-changes
      - build-and-push

    if: needs.detect-changes.outputs.services != '[]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Update image tags
        env:
          SERVICES: ${{ needs.detect-changes.outputs.services }}
          TAG: sha-${{ github.sha }}
        run: |
          for service in $(echo "$SERVICES" | jq -r '.[]'); do
            echo "Updating $service -> $TAG"

            yq -i \
              ".images[\"$service\"].tag = \"$TAG\"" \
              onlineboutique/values.yaml
          done

      - name: Show updated values
        run: |
          git diff -- onlineboutique/values.yaml

      - name: Commit GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add onlineboutique/values.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "ci: update images to ${GITHUB_SHA}"
          git push
